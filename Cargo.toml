[package]
name = "wisp_paper"
version = "0.1.0"
edition = "2024"
description = "A local-first literature library drawn with GPUI: collect, organise, preview PDFs and ask AI about your papers"
license = "MIT"
readme = "README.md"

# `wisp_core` is the GPUI-free library engine; plain `cargo test` covers both.
[workspace]
members = ["crates/core"]
default-members = [".", "crates/core"]

[dependencies]
wisp_core = { path = "crates/core" }
anyhow = "1"
dirs = "7"
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = { version = "3", features = ["json"] }
hayro = "0.9"
async-channel = "2"

# GPUI 0.2.2 / taffy 0.9.0 / xattr 0.2.3 with the quiet-md patches (Windows
# IME, CJK line breaking, …); see vendor/PATCHES.md.
[patch.crates-io]
gpui = { path = "vendor/gpui" }
taffy = { path = "vendor/taffy" }
xattr = { path = "vendor/xattr" }

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"

[lints]
workspace = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
winresource = "0.1"
