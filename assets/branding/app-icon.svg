<!-- 本项目绘制: a sheet of paper with a wisp drifting across it. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B3A8F"/>
      <stop offset="1" stop-color="#7A5BD6"/>
    </linearGradient>
    <linearGradient id="wisp" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5B4BC4"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#ground)"/>
  <!-- the sheet, top-right corner folded -->
  <path d="M176 112h108l84 84v180a28 28 0 0 1-28 28H176a28 28 0 0 1-28-28V140a28 28 0 0 1 28-28z" fill="#FFFFFF"/>
  <path d="M284 112v56a28 28 0 0 0 28 28h56z" fill="#D6CEF7"/>
  <!-- the wisp -->
  <path d="M186 348c22-66 56-84 80-48s50 18 66-52" fill="none" stroke="url(#wisp)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M200 262c18-30 38-36 54-16s34 12 46-18" fill="none" stroke="#B9A8F5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
</svg>
