name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The whole workspace, window included, on every system a package is built for.
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
          - { name: Linux, os: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@v4
      - name: Libraries GPUI builds against (Linux)
        if: runner.os == 'Linux'
        run: scripts/linux-build-deps.sh
      # rust-toolchain.toml names the toolchain; rustup installs it on first use.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
