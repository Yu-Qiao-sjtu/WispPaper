name: Release

# Pushing a tag like v0.1.0 builds the packages and publishes a release with them.
# A pull request that touches the packaging, or a manual run, only builds the
# packages and keeps them as artifacts of the run: a rehearsal, nothing is published.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest, target: x86_64-pc-windows-msvc, label: windows-x64 }
          - { name: macOS Apple silicon, os: macos-latest, target: aarch64-apple-darwin, label: macos-arm64 }
          - { name: macOS Intel, os: macos-latest, target: x86_64-apple-darwin, label: macos-x64 }
          # An older Ubuntu, so the binaries also start on systems with an older glibc.
          - { name: Linux x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, label: linux-x64 }
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the version in Cargo.toml
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Libraries GPUI builds against (Linux)
        if: runner.os == 'Linux'
        run: scripts/linux-build-deps.sh
      - run: rustup show
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p wisp_paper -p wisp_cli
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "WispPaper-v$env:VERSION-${{ matrix.label }}"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/wisp_paper.exe" "dist/$name/WispPaper.exe"
          Copy-Item "target/${{ matrix.target }}/release/wisp.exe" "dist/$name/wisp.exe"
          Copy-Item LICENSE, THIRD_PARTY.md, README.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: scripts/package-macos.sh "${{ matrix.target }}" "$VERSION" "${{ matrix.label }}"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: scripts/package-linux.sh "${{ matrix.target }}" "$VERSION" "${{ matrix.label }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.tar.gz --title "Wisp Paper $GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.tar.gz --title "Wisp Paper $GITHUB_REF_NAME" --generate-notes
          fi
