name: Release

# Pushing a tag like v0.2.0 builds the packages, signs them and publishes a
# release with them. The signing follows BiblioCell's release workflow:
#
# - macOS: scripts/package-macos.sh builds two DMGs, one for Apple silicon
#   (arm64) and one for Intel (x64). Each signs
#   "Wisp Paper.app" with the Developer ID certificate, has Apple notarize the
#   app and the DMG, and staples the tickets. The certificate lives in a
#   keychain made for the run.
# - Windows: scripts/package-windows.ps1 -Sign signs WispPaper.exe and wisp.exe
#   through SSL.com's eSigner (scripts/sign-windows-esigner.ps1) and zips them.
# - Linux: a plain tar.gz, not signed.
#
# A release is never published unsigned: with one of the secrets missing the
# run stops before it builds anything. They carry the same names as in
# BiblioCell, so the same certificates can be used:
#   MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD,
#   ESIGNER_CREDENTIAL_ID, ESIGNER_USERNAME, ESIGNER_PASSWORD, ESIGNER_TOTP_SECRET, ESIGNER_PIN
#
# A pull request that touches the packaging is a rehearsal: the packages are
# built unsigned (no secret is used, no signature spent) and kept as artifacts
# of the run. A manual run builds an existing tag again, signed; it publishes
# only when asked to, so it can be used to look at the signatures first.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", "scripts/**"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build (it must exist, like v0.2.0)
        required: true
        type: string
      publish:
        description: Create or update the release (off keeps the signed packages as artifacts only)
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # What is built: the tag a manual run names, else what the run was started for.
  BUILD_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
  # The tag being released; empty in a rehearsal.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}
  NOTARY_PROFILE: wisppaper-notary

jobs:
  check:
    name: Version and signing secrets
    # Fork releases use their own documented packaging route, never upstream credentials.
    if: github.repository == 'xuzhougeng/WispPaper' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sign: ${{ steps.version.outputs.sign }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
      - name: The tag is the version in Cargo.toml
        id: version
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ -n "$RELEASE_TAG" ] && [ "v$version" != "$RELEASE_TAG" ]; then
            echo "::error::Tag $RELEASE_TAG does not match Cargo.toml version $version. Bump the version and tag again." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A pull request only rehearses the packaging.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then sign=false; else sign=true; fi
          echo "sign=$sign" >> "$GITHUB_OUTPUT"
          echo "Wisp Paper $version, signed: $sign"
      - name: Every signing secret is set
        if: steps.version.outputs.sign == 'true'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
          ESIGNER_PIN: ${{ secrets.ESIGNER_PIN }}
        run: |
          set -euo pipefail
          missing=()
          for name in MAC_CERT_P12_BASE64 MAC_CERT_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD \
                      ESIGNER_CREDENTIAL_ID ESIGNER_USERNAME ESIGNER_PASSWORD ESIGNER_TOTP_SECRET ESIGNER_PIN; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Releases are always signed. Missing repository secrets: ${missing[*]}" >&2
            exit 1
          fi
          echo "All signing secrets are set"

  macos:
    name: macOS ${{ matrix.arch }}
    needs: check
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            lipo: arm64
            other: x86_64
          - arch: x64
            target: x86_64-apple-darwin
            lipo: x86_64
            other: arm64
    env:
      VERSION: ${{ needs.check.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
      # rust-toolchain.toml names the toolchain; rustup installs it on first use.
      - run: rustup show
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.arch }}

      # As BiblioCell does it: a keychain for this run, and the identity read
      # from the certificate, so no secret has to name it.
      - name: Import the Developer ID certificate
        if: needs.check.outputs.sign == 'true'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="${RUNNER_TEMP}/wisppaper-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          python3 -c 'import base64, os; open("cert.p12", "wb").write(base64.b64decode(os.environ["MAC_CERT_P12_BASE64"].strip()))'

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" login.keychain
          security default-keychain -s "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security import cert.p12 -k "${KEYCHAIN_PATH}" -P "${MAC_CERT_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcrun
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          rm -f cert.p12

          echo "Codesigning identities after import:"
          security find-identity -v -p codesigning "${KEYCHAIN_PATH}"
          identity="$(security find-identity -v -p codesigning "${KEYCHAIN_PATH}" | awk '/Developer ID Application/ {print $2; exit}')"
          if [[ -z "${identity}" ]]; then
            echo "::error::No Developer ID Application identity in the keychain. Check MAC_CERT_P12_BASE64 / MAC_CERT_PASSWORD and that the .p12 includes the private key." >&2
            exit 1
          fi
          {
            echo "WISP_MACOS_SIGNING_IDENTITY=${identity}"
            echo "CODESIGN_KEYCHAIN=${KEYCHAIN_PATH}"
            echo "WISP_NOTARY_PROFILE=${NOTARY_PROFILE}"
          } >> "${GITHUB_ENV}"

      - name: Store the notarization credentials
        if: needs.check.outputs.sign == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials "${NOTARY_PROFILE}" \
            --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_PASSWORD}"

      # The binary for this architecture (cross-compiled for Intel on an Apple
      # silicon runner), the bundle, its signature, the DMG, and (signed)
      # Apple's tickets. A signature or
      # notarization that fails fails the script, so a signed run cannot end
      # with an unsigned DMG.
      - name: Build and package
        run: scripts/package-macos.sh --arch "${ARCH}"

      - name: Check the package
        env:
          SIGNED: ${{ needs.check.outputs.sign }}
          LIPO_ARCH: ${{ matrix.lipo }}
          OTHER_ARCH: ${{ matrix.other }}
        run: |
          set -euo pipefail
          dmg="dist/WispPaper-v${VERSION}-macos-${ARCH}.dmg"
          app="dist/Wisp Paper.app"
          if [[ ! -f "${dmg}" ]]; then
            echo "::error::Expected ${dmg}" >&2
            ls -la dist || true
            exit 1
          fi
          codesign --verify --strict --verbose=2 "${app}"
          for binary in wisp_paper wisp; do
            lipo "${app}/Contents/MacOS/${binary}" -verify_arch "${LIPO_ARCH}"
            # Each DMG holds its own architecture and nothing else.
            if lipo "${app}/Contents/MacOS/${binary}" -verify_arch "${OTHER_ARCH}" 2>/dev/null; then
              echo "::error::${binary} in the ${ARCH} package also holds ${OTHER_ARCH}" >&2
              exit 1
            fi
          done
          # The Intel binary runs here through Rosetta, where the runner has it.
          if arch "-${LIPO_ARCH}" /usr/bin/true 2>/dev/null; then
            arch "-${LIPO_ARCH}" "${app}/Contents/MacOS/wisp" help >/dev/null
          else
            echo "::warning::No way to run ${LIPO_ARCH} on this runner: wisp help not tried"
          fi
          hdiutil verify "${dmg}" >/dev/null
          if [[ "${SIGNED}" != true ]]; then
            echo "Rehearsal: ad hoc signature, not notarized"
            exit 0
          fi

          codesign -dvv "${app}" 2>&1 | grep -E 'Authority=Developer ID Application|TeamIdentifier|flags='
          codesign --verify --verbose=2 "${dmg}"
          # stapler validate asks Apple; it is tried again when the connection drops.
          for attempt in 1 2 3 4 5; do
            if xcrun stapler validate "${dmg}"; then break; fi
            if (( attempt == 5 )); then
              echo "::error::stapler validate failed for ${dmg}" >&2
              exit 1
            fi
            sleep $((15 * attempt))
          done
          xcrun stapler validate "${app}"
          spctl --assess --type execute -vv "${app}"
          spctl --assess --type open --context context:primary-signature -vv "${dmg}"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

      - name: Remove the keychain
        if: always()
        run: |
          if [[ -n "${CODESIGN_KEYCHAIN:-}" && -f "${CODESIGN_KEYCHAIN}" ]]; then
            security delete-keychain "${CODESIGN_KEYCHAIN}" || true
          fi

  windows:
    name: Windows x64
    needs: check
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.check.outputs.version }}
      SIGNED: ${{ needs.check.outputs.sign }}
      ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
      ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
      ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
      ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
      ESIGNER_PIN: ${{ secrets.ESIGNER_PIN }}
    steps:
      # The runner context is not there yet where the job's env is read.
      - name: Where the signing script keeps its log
        shell: pwsh
        run: '"ESIGNER_SIGN_LOG=$env:RUNNER_TEMP\esigner-signed.log" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8'

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64

      - name: Cache CodeSignTool
        if: needs.check.outputs.sign == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/CodeSignTool
          key: codesigntool-1.3.2-windows

      - name: Install CodeSignTool
        if: needs.check.outputs.sign == 'true'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/sign-windows-esigner.ps1 -Install

      # A signature that fails fails the script, so a signed run cannot end with an unsigned zip.
      - name: Build and package
        shell: pwsh
        run: |
          if ($env:SIGNED -eq 'true') { ./scripts/package-windows.ps1 -Sign } else { ./scripts/package-windows.ps1 }
          if ($LASTEXITCODE -ne 0) { throw "package-windows.ps1 exited $LASTEXITCODE" }

      - name: Check the package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "WispPaper-v$($env:VERSION)-windows-x64"
          $zip = Join-Path 'dist' "$name.zip"
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
            Get-ChildItem -Recurse dist -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            throw "Expected $zip"
          }
          # What is in the zip is checked, not the files it was made from.
          $check = Join-Path $env:RUNNER_TEMP 'release-zip-check'
          if (Test-Path -LiteralPath $check) { Remove-Item -LiteralPath $check -Recurse -Force }
          Expand-Archive -LiteralPath $zip -DestinationPath $check
          $folder = Join-Path $check $name
          foreach ($leaf in @('WispPaper.exe', 'wisp.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $folder $leaf) -PathType Leaf)) { throw "Missing $leaf in $zip" }
          }
          & (Join-Path $folder 'wisp.exe') help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "wisp.exe help exited $LASTEXITCODE" }
          if ($env:SIGNED -ne 'true') { Write-Host 'Rehearsal: not signed'; return }

          foreach ($leaf in @('WispPaper.exe', 'wisp.exe')) {
            $sig = Get-AuthenticodeSignature -LiteralPath (Join-Path $folder $leaf)
            if ("$($sig.Status)" -ne 'Valid') { throw "$leaf Authenticode status $($sig.Status): $($sig.StatusMessage)" }
            if (-not $sig.TimeStamperCertificate) { throw "$leaf has no RFC3161 timestamp" }
            Write-Host "${leaf}: $($sig.Status), $($sig.SignerCertificate.Subject)"
          }
          if (-not (Test-Path -LiteralPath $env:ESIGNER_SIGN_LOG)) { throw "eSigner sign log not found: $env:ESIGNER_SIGN_LOG" }
          $log = Get-Content -LiteralPath $env:ESIGNER_SIGN_LOG
          Write-Host 'eSigner signed:'; $log | ForEach-Object { Write-Host "  $_" }
          # The app and the command line: both signatures are in the log.
          if (@($log | Where-Object { $_ -like 'signed*' }).Count -lt 2) { throw 'Expected at least 2 eSigner signatures (WispPaper.exe, wisp.exe)' }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.zip
          if-no-files-found: error

  linux:
    name: Linux x64
    needs: check
    # An older Ubuntu, so the binaries also start on systems with an older glibc.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
      - name: Libraries GPUI builds against
        run: scripts/linux-build-deps.sh
      - run: rustup show
      - run: rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x64
      - name: Build
        run: cargo build --release --target "$TARGET" -p wisp_paper -p wisp_cli
      - name: Package
        run: scripts/package-linux.sh "$TARGET" "$VERSION" linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [macos, windows, linux]
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          ls -la
          count() { find . -maxdepth 1 -type f -name "$1" | wc -l; }
          if (( $(count '*-macos-arm64.dmg') != 1 || $(count '*-macos-x64.dmg') != 1 || $(count '*.dmg') != 2 || $(count '*.zip') != 1 || $(count '*.tar.gz') != 1 )); then
            echo "::error::Expected two DMGs (arm64, x64), one zip and one tar.gz" >&2
            exit 1
          fi
          sha256sum *.dmg *.zip *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          cd ..

          assets=(dist/*.dmg dist/*.zip dist/*.tar.gz dist/SHA256SUMS)
          notes=".github/release-notes/${RELEASE_TAG}.md"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
          elif [[ -f "${notes}" ]]; then
            gh release create "${RELEASE_TAG}" "${assets[@]}" --verify-tag --title "Wisp Paper ${RELEASE_TAG}" --notes-file "${notes}"
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" --verify-tag --title "Wisp Paper ${RELEASE_TAG}" --generate-notes
          fi
